model:
  model_name: NEP
  prompt_template: ["a photo of x x", "a photo of x", "a photo of x"]
  ctx_init: ["a photo of ", "a photo of ", "a photo of "]
  clip_model: "ViT-L/14"
  num_units: 32
  m_layers: 24
  adapter_dim: 128

train:
  dataset: mit-states
  step_size: 5
  gamma: 0.5
  lr: 0.0001
  weight_decay: 1.0e-5
  ls: 0.01
  attr_dropout: 0.1
  # obj_dropout: 0.1
  # com_dropout: 0.1
  train_batch_size: 64
  epochs: 8
  context_length: 8
  seed: 0
  val_metric: AUC
  save_final_model: True
  save_path: weight
  att_loss_weight: 1.0
  obj_loss_weight: 1.0
  com_loss_weight: 1.0
  glb_loss_weight: 1.0

test:
  open_world: false  # If it’s the open-world setting, just set it to "true"
  eval_batch_size: 64
  feasibility: CAMS/feasibilities/feasibility_mit.pt
  threshold: 0.3625205941
  threshold_trials: 50
  beta: 0.85
  load_model: false # Path of the trained model

